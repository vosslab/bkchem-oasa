[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oasa"
description = "OASA is a free cheminformatics library written in Python"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{name = "Beda Kosata", email = "beda@zirael.org"}]
maintainers = [{name = "Reinis Danne", email = "rei4dan@gmail.com"}]
version = "26.07"
dependencies = [
    "defusedxml",
    "lxml",
    "pycairo",
    "pyyaml",
    "rdkit",
    "rustworkx",
]

[project.urls]
Homepage = "https://github.com/vosslab/bkchem"
Issues = "https://github.com/vosslab/bkchem/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["oasa*"]

[tool.setuptools.package-data]
oasa_data = ["*.json", "*.yaml"]
